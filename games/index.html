<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>シニアゲーム</title>

<!-- ホーム画面追加用(PWA)。manifest・アイコン・Service Workerはすべてこのフォルダ
     (games/)の中に置き、相対パスで読む(GitHub Pagesのサブフォルダで動かすため)。
     scopeは games/ 全体なので、各ゲーム(solitaire/・sudoku/)もアプリの中で開き、
     各ゲームの[メニュー]ボタンでここへ戻る。
     アイコンはハートのエースのカード1枚と「ゲーム」の文字(2026年10月、niisanがChatGPTで生成)。
     ブラウザのタブ用(favicon-16/32)は、小さくても分かるようカードの部分だけを切り出している。 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シニアゲーム">
<meta name="theme-color" content="#1B2430">

<!--
  games/index.html: シニアゲーム(ゲームメニュー)
  公開URL: https://uniiqcode.github.io/games/

  【uniiqcode.github.io 公開用コピー】2026年10月、niisan-tvリポジトリの
  frontend/games/index.html を複製。変更点はパスの相対化、見出し下の表記、
  Service Workerを1つ(games/sw.js)にまとめたこと。
  (トップへ戻るリンクは一度付けたが、niisanの指定で外した)

  ・各ゲームの保存データ(localStorage、同じサイト内なので読める)から、
    クリア回数・ベスト記録・遊びかけの有無を表示する。読むだけで書き換えはしない。
  ・ゲームを増やす時は、games/<ゲーム名>/index.html を置き、GAMES配列に1件足すと
    同じ形のカードがもう1枚並ぶ。オフラインでも遊べるようにするには、
    games/sw.js のファイル一覧にも足し、CACHE_NAMEの番号を上げる。
-->
<style>
  :root {
    --bg1: #24324A;
    --bg2: #141B25;
    --text: #F3F1E8;
    --sub: #A9B3C1;
    --card: rgba(255, 255, 255, 0.07);
    --card-line: rgba(255, 255, 255, 0.14);
    --accent: #FFD54F;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg2); }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: linear-gradient(180deg, var(--bg1), var(--bg2) 70%) fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none;
    padding: calc(env(safe-area-inset-top) + 28px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px);
  }
  header { max-width: 720px; margin: 0 auto 22px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: 0.08em; }
  header p { margin: 4px 0 0; color: var(--sub); font-size: 13px; letter-spacing: 0.1em; }

  .list {
    max-width: 720px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr; gap: 14px;
  }
  @media (min-width: 600px) { .list { grid-template-columns: 1fr 1fr; } }

  .game {
    display: flex; align-items: center; gap: 16px;
    padding: 16px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--card-line);
    color: inherit; text-decoration: none;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .game:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.13); }
  .game svg { flex: none; width: 88px; height: 88px; border-radius: 18px; }
  .game .body { min-width: 0; flex: 1; }
  .game h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .game .desc { margin: 4px 0 0; color: var(--sub); font-size: 13px; line-height: 1.45; }
  .game .rec { margin: 8px 0 0; font-size: 12px; color: var(--text); opacity: 0.85; font-variant-numeric: tabular-nums; }
  .nw { white-space: nowrap; }
  .badge {
    font-size: 11px; font-weight: bold; color: #222; background: var(--accent);
    border-radius: 999px; padding: 2px 8px; letter-spacing: 0.05em;
  }
  .arrow { flex: none; color: var(--sub); font-size: 22px; }
</style>
</head>
<body>

<header>
  <h1>シニアゲーム</h1>
  <p>uniiqcode.github.io/games</p>
</header>

<main class="list" id="list"></main>

<script>
(function () {
  'use strict';

  function storageGet(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function fmtTime(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  // メニューに並べるゲーム。art はカード左の絵(SVG)、record は保存データから記録の文を作る関数
  var GAMES = [
    {
      name: 'ソリティア',
      href: 'solitaire/',
      desc: 'クロンダイク。タップで自動移動、1枚/3枚めくり。',
      art:
        '<svg viewBox="0 0 88 88"><rect width="88" height="88" fill="#1F4D3A"/>' +
        '<g transform="translate(30 46) rotate(-10)"><rect x="-17" y="-24" width="34" height="48" rx="4" fill="#FFFDF7"/>' +
        '<text x="-12" y="-9" font-size="12" font-weight="700" fill="#1B1B1B" font-family="Helvetica,Arial,sans-serif">K</text>' +
        '<text x="0" y="14" font-size="22" text-anchor="middle" fill="#1B1B1B">♠</text></g>' +
        '<g transform="translate(56 42) rotate(8)"><rect x="-17" y="-24" width="34" height="48" rx="4" fill="#FFFDF7"/>' +
        '<text x="-12" y="-9" font-size="12" font-weight="700" fill="#C62828" font-family="Helvetica,Arial,sans-serif">A</text>' +
        '<text x="0" y="14" font-size="22" text-anchor="middle" fill="#C62828">♥</text></g></svg>',
      record: function () {
        var stats = storageGet('solitaire01-stats-v1');
        var saved = storageGet('solitaire01-state-v1');
        var playing = saved && saved.state && saved.state.moves > 0 && !saved.state.won;
        var text = stats && stats.wins ? 'クリア ' + stats.wins + '回 ・ ベスト ' + fmtTime(stats.best) : '';
        return { text: text, playing: playing };
      }
    },
    {
      name: '数独',
      href: 'sudoku/',
      desc: 'ナンプレ。初級・中級・上級、メモとヒント付き。',
      art:
        '<svg viewBox="0 0 88 88"><rect width="88" height="88" fill="#2F5FA8"/>' +
        '<rect x="14" y="14" width="60" height="60" rx="4" fill="#FFFDF7"/>' +
        '<path d="M34 14v60M54 14v60M14 34h60M14 54h60" stroke="#B9B4A6" stroke-width="1.5"/>' +
        '<rect x="14" y="14" width="60" height="60" rx="4" fill="none" stroke="#1B2430" stroke-width="2.5"/>' +
        '<g font-size="15" font-weight="700" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" fill="#1B2430">' +
        '<text x="24" y="30">5</text><text x="64" y="30">3</text><text x="44" y="50">9</text>' +
        '<text x="24" y="70" fill="#1565C0">7</text><text x="64" y="70">1</text></g></svg>',
      record: function () {
        var stats = storageGet('sudoku01-stats-v1') || {};
        var saved = storageGet('sudoku01-state-v1');
        var s = saved && saved.state;
        var playing = !!(s && !s.done && s.values && s.values.some(function (v, i) { return v && !s.puzzle[i]; }));
        var parts = [];
        ['初級', '中級', '上級'].forEach(function (name, lv) {
          var r = stats['L' + lv];
          if (r && r.clears) parts.push('<span class="nw">' + name + ' ' + r.clears + '回' + (r.best !== null ? '(' + fmtTime(r.best) + ')' : '') + '</span>');
        });
        return { text: parts.length ? 'クリア: ' + parts.join(' ・ ') : '', playing: playing };
      }
    }
  ];

  function render() {
    var list = document.getElementById('list');
    list.innerHTML = '';
    GAMES.forEach(function (g) {
      var r = g.record();
      var a = document.createElement('a');
      a.className = 'game';
      a.href = g.href;
      a.innerHTML =
        g.art +
        '<div class="body"><h2>' + g.name + (r.playing ? '<span class="badge">つづきから</span>' : '') + '</h2>' +
        '<p class="desc">' + g.desc + '</p>' +
        (r.text ? '<p class="rec">' + r.text + '</p>' : '') +
        '</div><span class="arrow">›</span>';
      list.appendChild(a);
    });
  }

  // オフライン対応: games/sw.js(範囲は games/ 全体)を登録する。メニューと各ゲームを
  // まとめて保存するので、一度このメニューを開いた端末では圏外でも遊べる。
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 登録できなくても遊ぶことはできる */ });
    });
  }

  render();
  // ゲームから戻ってきた時に記録を更新する
  window.addEventListener('pageshow', render);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
