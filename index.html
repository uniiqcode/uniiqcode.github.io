<style>
  /* 背景は真っ白ではなく、少し温かみのある薄いグレー（まぶしさを抑え、白いアイコンの縁も見える） */
  :root { --bg: #ece9e2; --line: rgba(0, 0, 0, 0.14); --focus: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --line: rgba(255, 255, 255, 0.16); --focus: #4493f8; }
  }
  body { margin: 0; background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  /* Uマーク＋文字ロゴを横に並べる */
  h1 { margin: 0 0 40px; line-height: 0; display: flex; align-items: center; gap: 14px; }
  h1 img { display: block; width: auto; }
  /* Uマークは白い正方形のシールにして、ページに貼ったように少し影をつける */
  h1 .sticker { flex: none; width: 64px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
                background: #fff; border-radius: 10px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), 0 3px 8px rgba(0, 0, 0, 0.12); }
  h1 .mark { height: 46px; }
  /* 文字ロゴは、文字の本体（大文字の上から並びの底まで。「i」の点と「q」の下は除く）の上下の真ん中を、
     シールの上下の真ん中にそろえる。画像の真ん中より本体の真ん中が約2px上にあるので、その分だけ下げる */
  h1 .wordmark { height: 48px; position: relative; top: 2px; min-width: 0; max-width: calc(100% - 78px); object-fit: contain; object-position: left center; }
  /* ダークモードでは文字ロゴだけ白に。シールは白地に黒のまま（貼ったシールなので色は変わらない） */
  @media (prefers-color-scheme: dark) {
    h1 .wordmark { filter: invert(1); }
    h1 .sticker { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.45); }
  }
  .apps { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 24px; }
  .apps a { display: block; border-radius: 22%; transition: transform .15s; }
  .apps a:hover { transform: translateY(-2px); }
  .apps a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .apps img { display: block; width: 96px; height: 96px; border-radius: 22%; border: 1px solid var(--line); }
</style>

<main>
