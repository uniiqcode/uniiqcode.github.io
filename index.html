<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniiqcode</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #ffffff; --line: #d0d7de; --focus: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --line: #30363d; --focus: #4493f8; }
  }
  body { margin: 0; background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 40px; line-height: 0; }
  h1 img { display: block; height: 48px; width: auto; max-width: 100%; }
  @media (prefers-color-scheme: dark) { h1 img { filter: invert(1); } }
  .apps { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 24px; }
  .apps a { display: block; border-radius: 22%; transition: transform .15s; }
  .apps a:hover { transform: translateY(-2px); }
  .apps a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .apps img { display: block; width: 96px; height: 96px; border-radius: 22%; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1><img src="assets/logo/uniiqcode-wordmark.svg" alt="Uniiqcode" width="866" height="194"></h1>
  <ul class="apps">
    <!-- アプリを追加したら、ここに1行ずつ足す: <li><a href="フォルダ名/"><img src="アイコン.png" alt="アプリの名前" title="アプリの名前"></a></li> -->
    <li><a href="games/"><img src="games/icons/icon-192.png" alt="ゲーム" title="ゲーム"></a></li>
    <li><a href="gyosu-sakaba/"><img src="assets/icons/gyosu-sakaba.png" alt="業スー酒場" title="業スー酒場"></a></li>
  </ul>
</main>
</body>
</html>
