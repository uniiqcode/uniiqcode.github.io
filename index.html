<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uniiqcode</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --link: #4493f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a { display: block; padding: 14px 4px; color: var(--link); text-decoration: none; }
  li a:hover { text-decoration: underline; }
  li.empty { padding: 14px 4px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>uniiqcode</h1>
  <p class="lead">作成したページの一覧</p>
  <ul>
    <!-- ページを追加したら、ここに1行ずつ足す: <li><a href="ファイル名.html">ページの名前</a></li> -->
    <li class="empty">まだページはありません</li>
  </ul>
</main>
</body>
</html>
