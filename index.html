<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniiqcode</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Uniiqcode">
<meta name="apple-mobile-web-app-title" content="Uniiqcode">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ece9e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Uniiqcode">
<meta property="og:title" content="Uniiqcode">
<meta property="og:url" content="https://uniiqcode.github.io/">
<meta property="og:image" content="https://uniiqcode.github.io/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Uniiqcode">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Uniiqcode">
<style>
  /* 背景は真っ白ではなく、少し温かみのある薄いグレー（まぶしさを抑え、白いアイコンの縁も見える） */
  :root { --bg: #ece9e2; --line: rgba(0, 0, 0, 0.14); --focus: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --line: rgba(255, 255, 255, 0.16); --focus: #4493f8; }
  }
  body { margin: 0; background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  /* Uマーク＋文字ロゴを横に並べる */
  h1 { margin: 0 0 40px; line-height: 0; display: flex; align-items: flex-end; gap: 14px; }
  h1 img { display: block; width: auto; }
  h1 .mark { height: 56px; }
  /* 文字ロゴは「q」の下に伸びる分だけ下げて、Uマークの底と文字の並び（ベースライン）をそろえる */
  h1 .wordmark { height: 48px; margin-bottom: -8px; min-width: 0; max-width: calc(100% - 56px); object-fit: contain; object-position: left bottom; }
  @media (prefers-color-scheme: dark) { h1 img { filter: invert(1); } }
  .apps { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 24px; }
  .apps a { display: block; border-radius: 22%; transition: transform .15s; }
  .apps a:hover { transform: translateY(-2px); }
  .apps a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .apps img { display: block; width: 96px; height: 96px; border-radius: 22%; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1><img class="mark" src="assets/logo/uniiqcode-u.svg" alt="" width="162" height="216"><img class="wordmark" src="assets/logo/uniiqcode-wordmark.svg" alt="Uniiqcode" width="866" height="194"></h1>
  <ul class="apps">
    <!-- アプリを追加したら、ここに1行ずつ足す: <li><a href="フォルダ名/"><img src="アイコン.png" alt="アプリの名前" title="アプリの名前"></a></li> -->
    <li><a href="games/"><img src="games/icons/icon-192.png" alt="ゲーム" title="ゲーム"></a></li>
    <li><a href="weather/"><img src="weather/icons/icon-192.png" alt="現在地の天気" title="現在地の天気"></a></li>
    <li><a href="gyosu-sakaba/"><img src="assets/icons/gyosu-sakaba.png" alt="業スー酒場" title="業スー酒場"></a></li>
  </ul>
</main>
</body>
</html>
