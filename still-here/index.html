<!--
  Still Here(仕様: docs/still-here.md)
  - iOS15 の Safari で動くこと。CSS は :has()・dvh・コンテナクエリ等を使わない。
  - 色は app.js の COLORS(24色の固定表)から「時」で選び、--bg / --fg に入れる。
    雨予報・ラジオも同じ --bg / --fg だけを使う。
-->
<style>
  :root { --bg: #12161A; --fg: #ECE8DF; --T: 20vw; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  /* 起動直後は色を即座に反映し、その後の「時」の切り替えだけゆっくり変える */
  body.ready { transition: background-color 2s linear, color 2s linear; }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .col { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .col + .col { margin-top: 5vh; }

  /* 時刻: 数字は travelフォント(SVG)。桁ごとに固定幅の枠に入れて中央揃え */
  .time { display: flex; align-items: flex-end; height: var(--T); }
  .slot { display: flex; align-items: center; justify-content: center; height: 100%; width: calc(var(--T) * 0.6); }
  .slot svg { display: block; height: 100%; width: auto; }
  .colon { flex-direction: column; justify-content: center; width: calc(var(--T) * 0.2); }
  .colon i { display: block; width: calc(var(--T) * 0.09); height: calc(var(--T) * 0.09); border-radius: 50%; background: currentColor; margin: calc(var(--T) * 0.1) 0; }
  /* 秒は時分の70%の大きさで、下揃え */
  .sec { display: flex; height: calc(var(--T) * 0.7); margin-left: calc(var(--T) * 0.12); }
  .sec .slot { width: calc(var(--T) * 0.42); }

  .weekday { font-size: calc(var(--T) * 0.34); margin-top: calc(var(--T) * 0.12); letter-spacing: 0.1em; }
  .date { font-size: calc(var(--T) * 0.22); margin-top: calc(var(--T) * 0.06); letter-spacing: 0.05em; }
  .sun { display: flex; margin-top: calc(var(--T) * 0.12); font-size: calc(var(--T) * 0.2); }
  .sun div + div { margin-left: 2em; }
  .label { opacity: 0.6; font-size: 0.75em; margin-right: 0.4em; letter-spacing: 0.1em; }

  /* 雨予報(文字のみ) */
  .rain { text-align: center; max-width: 30em; }
  .rain .main { font-size: calc(var(--T) * 0.2); line-height: 1.5; }
  .rain .sub { font-size: calc(var(--T) * 0.13); opacity: 0.65; margin-top: 0.3em; line-height: 1.5; }

  /* ラジオ: 背景・文字色は他と同じ。選ばれたボタンだけ色を反転 */
  .radio { margin-top: 4vh; width: 100%; max-width: 34em; font-size: calc(var(--T) * 0.13); }
  .radio button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--fg); border-radius: 0.5em;
    padding: 0.55em 0.2em; margin: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none;
  }
  body.ready .radio button { transition: background-color 2s linear, color 2s linear, border-color 2s linear; }
  .radio button.on { background: var(--fg); color: var(--bg); }
  .power { display: flex; flex-direction: column; align-items: center; }
  .power button { width: 6.5em; letter-spacing: 0.1em; }
  .power .state { margin-top: 0.4em; opacity: 0.75; min-height: 1.4em; }
  .stations { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 0.8em; }
  .stations button { width: calc(20% - 0.4em); margin: 0.2em; font-size: 0.85em; line-height: 1.25; }
  .stations button small { display: block; font-size: 0.8em; opacity: 0.7; }

  /* 縦向き: 時刻の大きさは横幅で決める */
  @media (orientation: portrait) {
    :root { --T: min(19vw, 13vh); }
    .stations button { width: calc(20% - 0.4em); }
  }
  /* 横向き: 左に時刻〜日の出・日の入り、右に雨予報・ラジオ */
  @media (orientation: landscape) {
    :root { --T: min(11vw, 24vh); }
    main { flex-direction: row; }
    .col { width: 50%; }
    .col + .col { margin-top: 0; margin-left: 2vw; }
    .radio { font-size: calc(var(--T) * 0.15); }
    .rain .main { font-size: calc(var(--T) * 0.24); }
    .rain .sub { font-size: calc(var(--T) * 0.15); }
  }
  .debug { position: fixed; left: 4px; bottom: 4px; font: 11px monospace; opacity: 0.6; }
</style>
</head>
<body>
<main>
  <div class="col">
    <div class="time" id="time" aria-label="時刻"></div>
    <div class="weekday" id="weekday">--曜日</div>
    <div class="date" id="date">----年--月--日</div>
    <div class="sun">
      <div><span class="label">日の出</span><span id="sunrise">--:--</span></div>
      <div><span class="label">日の入り</span><span id="sunset">--:--</span></div>
    </div>
  </div>
  <div class="col">
    <section class="rain" aria-label="8時間以内の雨">
      <div class="main" id="rain-main">雨予報を取得しています…</div>
      <div class="sub" id="rain-sub"></div>
    </section>
    <section class="radio" aria-label="ラジオ">
      <div class="power">
        <button type="button" id="power" aria-pressed="false">OFF</button>
        <span class="state" id="radio-state"></span>
      </div>
      <div class="stations" id="stations"></div>
      <audio id="audio" preload="none"></audio>
    </section>
  </div>
</main>
<noscript><p style="text-align:center">JavaScript を有効にしてください。</p></noscript>
<script src="app.js"></script>
