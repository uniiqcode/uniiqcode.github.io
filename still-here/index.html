<!--
  Still Here(仕様: docs/still-here.md)
  - iOS15 の Safari で動くこと。CSS は :has()・dvh・コンテナクエリ等を使わない。
  - 色は app.js の COLORS(24色の固定表)から「時」で選び、--bg / --fg に入れる。
    雨予報・ラジオも同じ --bg / --fg だけを使う。
-->
<style>
  /* 文字は clock01.html(niisan.tv)と同じ Shippori Mincho。数字の時刻だけ travelフォント(SVG)。
     latin を後に書く: ブラウザは後の宣言から unicode-range を見るので、英数字だけなら軽い latin で済む */
  @font-face {
    font-family: "Shippori Mincho"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("fonts/shippori-mincho-japanese-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Shippori Mincho"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("fonts/shippori-mincho-latin-400-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
      U+FEFF, U+FFFD;
  }
  :root { --bg: #12161A; --fg: #ECE8DF; --T: 20vw; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  /* 起動直後は色を即座に反映し、その後の「時」の切り替えだけゆっくり変える */
  body.ready { transition: background-color 2s linear, color 2s linear; }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  /* 時刻以外の文字の倍率(遠くから読めるよう 150%) */
  :root { --k: 1.5; }
  .col { display: flex; flex-direction: column; align-items: center; width: 100%; }
  /* 時刻は独立させ、画面の上端と曜日のちょうど真ん中に置く(.timebox が上の空きを全部使い、その中央に時刻) */
  .timebox { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; width: 100%; }
  .info { display: flex; flex-direction: column; align-items: center; }

  /* 時刻: 数字は travelフォント(SVG)。桁ごとに固定幅の枠に入れて中央揃え */
  .time { display: flex; align-items: flex-end; height: var(--T); }
  .slot { display: flex; align-items: center; justify-content: center; height: 100%; width: calc(var(--T) * 0.6); }
  .slot svg { display: block; height: 100%; width: auto; }
  .colon { flex-direction: column; justify-content: center; width: calc(var(--T) * 0.2); }
  .colon i { display: block; width: calc(var(--T) * 0.09); height: calc(var(--T) * 0.09); border-radius: 50%; background: currentColor; margin: calc(var(--T) * 0.1) 0; }
  /* 秒は時分の70%の大きさで、下揃え */
  .sec { display: flex; height: calc(var(--T) * 0.7); margin-left: calc(var(--T) * 0.12); }
  .sec .slot { width: calc(var(--T) * 0.42); }

  /* 日付と曜日は1行(時刻が主役なので、曜日を大きくしない) */
  .date { font-size: calc(var(--T) * 0.26 * var(--k)); letter-spacing: 0.05em; }
  .sun { display: flex; margin-top: calc(var(--T) * 0.12); font-size: calc(var(--T) * 0.2 * var(--k)); }
  .sun div + div { margin-left: 2em; }
  .label { opacity: 0.6; font-size: 0.75em; margin-right: 0.4em; letter-spacing: 0.1em; }

  /* 雨予報(文字のみ) */
  .rain { text-align: center; width: 100%; margin-top: 5vh; }
  .rain .main { font-size: calc(var(--T) * 0.2 * var(--k)); line-height: 1.4; }
  .rain .chunk { display: inline-block; }
  .rain .sub { font-size: calc(var(--T) * 0.13 * var(--k)); opacity: 0.65; margin-top: 0.3em; line-height: 1.5; }

  /* ラジオ: 背景・文字色は他と同じ。選ばれたボタンだけ色を反転 */
  .radio { margin-top: 4vh; width: 100%; font-size: calc(var(--T) * 0.13 * var(--k)); }
  /* 10個のボタン(先頭が ON/OFF、残り9個が局)。すべて同じ大きさで 5×2 に並べる */
  .buttons { display: flex; flex-wrap: wrap; margin: -0.2em; }
  .radio button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--fg); border-radius: 0.5em;
    width: calc(20% - 0.4em); height: 3.4em; margin: 0.2em; padding: 0 0.1em;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: calc(0.8em / var(--k)); font-weight: bold; line-height: 1.15; overflow: hidden; white-space: normal;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none;
  }
  .radio button.on { background: var(--fg); color: var(--bg); }
  /* ボタンの名前は 150% にしない(元の大きさ)。かわりに太字。Shippori Mincho は太字のファイルが無いので、ブラウザが太らせて表示する */
  .radio .power { letter-spacing: 0.1em; }
  .radio .state { text-align: center; margin-top: 0.6em; opacity: 0.75; min-height: 1.4em; }

  /* 縦向き: ラジオ(ボタン10個と状態の1行)を画面の下に置く */
  @media (orientation: portrait) {
    :root { --T: min(19vw, 12vh); }
    /* 上から: 時刻(上の空きの中央) → 曜日・日付・日の出/日の入り → 雨予報 → ラジオ(画面の下) */
    main { justify-content: flex-start; }
    .col { flex: 1 1 auto; }
    .radio { margin-top: 4vh; font-size: calc(3.6vw * var(--k)); }
  }
  /* 横向き: 左に時刻〜日の出・日の入り、右に雨予報・ラジオ */
  @media (orientation: landscape) {
    :root { --T: min(11vw, 24vh); }
    /* 横向きは文字の倍率を 125% にする(時刻とボタンの名前は変わらない) */
    :root { --k: 1.25; }
    /* 左の列に時刻〜日の出・日の入り、右の列に雨予報とラジオ(下端は日の出・日の入りにそろえる。app.js の alignRight) */
    main {
      height: 100vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto auto 1fr;
      grid-column-gap: 3vw; align-items: center; justify-items: center;
    }
    /* 左の列: 時刻は上端と曜日の真ん中。曜日〜日の出/日の入りは列の下寄り */
    .col { grid-column: 1; grid-row: 1 / 5; align-self: stretch; }
    .info { padding-bottom: 8vh; }
    .rain { grid-column: 2; grid-row: 2; margin-top: 0; }
    .radio { grid-column: 2; grid-row: 3; font-size: calc(var(--T) * 0.15 * var(--k)); }
    .rain .main { font-size: calc(var(--T) * 0.24 * var(--k)); }
    .rain .sub { font-size: calc(var(--T) * 0.15 * var(--k)); }
  }
  .debug { position: fixed; left: 4px; bottom: 4px; font: 11px monospace; opacity: 0.6; }
</style>
</head>
<body>
<main>
  <!-- 画面に見出しは出さないが、ページに見出しを1つ置く(検索対策。docs/seo.md) -->
  <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Still Here</h1>
  <div class="col">
    <div class="timebox"><div class="time" id="time" aria-label="時刻"></div></div>
    <div class="info">
      <div class="date" id="date">--月--日 --曜日</div>
      <div class="sun">
        <div><span class="label">日の出</span><span id="sunrise">--:--</span></div>
        <div><span class="label">日の入り</span><span id="sunset">--:--</span></div>
      </div>
    </div>
  </div>
  <section class="rain" aria-label="8時間以内の雨">
      <div class="main" id="rain-main">雨予報を取得しています…</div>
      <div class="sub" id="rain-sub"></div>
  </section>
  <section class="radio" aria-label="ラジオ">
      <div class="buttons" id="buttons">
        <button type="button" class="power" id="power" aria-pressed="false">OFF</button>
      </div>
      <div class="state" id="radio-state"></div>
      <audio id="audio" preload="none"></audio>
    </section>
</main>
<noscript><p style="text-align:center">JavaScript を有効にしてください。</p></noscript>
