<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 「ここの天気」アイコン: 晴れ(太陽)・雲・雨と、現在地を示す赤いピン。文字は入れない -->
  <rect width="512" height="512" fill="#2f7fe0"/>
  <!-- 太陽 -->
  <g fill="#ffd43b">
    <circle cx="318" cy="150" r="74"/>
    <rect x="310" y="34" width="16" height="36" rx="8"/>
    <rect x="424" y="142" width="36" height="16" rx="8"/>
    <rect x="396" y="56" width="16" height="36" rx="8" transform="rotate(45 404 74)"/>
    <rect x="396" y="208" width="16" height="36" rx="8" transform="rotate(-45 404 226)"/>
  </g>
  <!-- 雲 -->
  <path d="M112 318 a58 58 0 0 1 8-115 a82 82 0 0 1 156-14 a62 62 0 0 1 34 129 z" fill="#ffffff"/>
  <!-- 雨 -->
  <g fill="#bfe0ff">
    <path d="M140 352 q16 30 0 46 q-16-16 0-46z"/>
    <path d="M206 352 q16 30 0 46 q-16-16 0-46z"/>
    <path d="M140 420 q16 30 0 46 q-16-16 0-46z"/>
    <path d="M206 420 q16 30 0 46 q-16-16 0-46z"/>
  </g>
  <!-- 現在地のピン -->
  <ellipse cx="368" cy="462" rx="46" ry="12" fill="#000" opacity=".22"/>
  <path d="M368 462 C 340 420, 290 372, 290 320 a78 78 0 0 1 156 0 c0 52 -50 100 -78 142z" fill="#ff4d4f" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="368" cy="320" r="30" fill="#ffffff"/>
</svg>
