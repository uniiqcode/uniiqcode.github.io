<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ここの天気</title>
<meta name="description" content="GPSの現在地から、雨の降り始め・24時間の雨量と気温・7日間の天気を表示します">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="天気">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #eef3f8; --card: #ffffff; --text: #1d2733; --sub: #5d6b7a; --line: rgba(0,0,0,.08);
    --accent: #1f6fd1; --rain: #2b7de9; --warn: #c2410c; --hot: #d9480f; --cold: #1c7ed6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720; --card: #18222d; --text: #e6edf3; --sub: #94a3b3; --line: rgba(255,255,255,.08);
      --accent: #5aa2ff; --rain: #4c9bff; --warn: #fb923c; --hot: #ff8a5c; --cold: #74b9ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header .where { flex: 1; min-width: 0; }
  header .place { font-size: 1.15rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .meta { font-size: .78rem; color: var(--sub); }
  button {
    font: inherit; font-size: .9rem; color: var(--accent); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  section { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  h2 { font-size: .85rem; color: var(--sub); font-weight: 600; margin: 0 0 8px; }
  .msg { color: var(--sub); font-size: .9rem; }
  .err { color: var(--warn); }

  /* 雨の降り始め */
  .rainstart .big { font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
  .rainstart .big.wet { color: var(--rain); }
  .rainstart .note { font-size: .8rem; color: var(--sub); margin-top: 4px; }

  /* 1時間ごと・3時間ごとの表 */
  .rows { display: grid; grid-template-columns: 4.2em 1.8em 3.4em 1fr; align-items: center; column-gap: 8px; }
  .rows .day { grid-column: 1 / -1; font-size: .78rem; color: var(--sub); font-weight: 600; padding: 10px 0 4px; border-top: 1px solid var(--line); }
  .rows .day:first-child { border-top: 0; padding-top: 0; }
  .rows > .t { font-size: .9rem; color: var(--sub); padding: 5px 0; }
  .rows > .i { font-size: 1.15rem; text-align: center; }
  .rows > .temp { text-align: right; font-size: .95rem; }
  .bar { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .bar .fill { height: 10px; border-radius: 5px; background: var(--rain); flex: none; }
  .bar .val { font-size: .82rem; color: var(--sub); white-space: nowrap; }
  .bar .val.wet { color: var(--text); font-weight: 600; }
  .lv1 { opacity: .45; } .lv2 { opacity: .75; } .lv3 { background: #f2c037 !important; } .lv4 { background: #f08c00 !important; } .lv5 { background: #e03131 !important; }
  .legend { font-size: .72rem; color: var(--sub); margin-top: 8px; }

  /* 4日目〜7日目 */
  .days .row { display: grid; grid-template-columns: 5.2em 2em 1fr auto; align-items: center; column-gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
  .days .row:first-child { border-top: 0; }
  .days .d { font-size: .9rem; }
  .days .d.sun { color: var(--hot); } .days .d.sat { color: var(--cold); }
  .days .i { font-size: 1.3rem; text-align: center; }
  .days .w { font-size: .88rem; }
  .days .w small { display: block; color: var(--sub); font-size: .72rem; white-space: nowrap; }
  .days .mm { text-align: right; white-space: nowrap; font-size: .95rem; }
  .hi { color: var(--hot); } .lo { color: var(--cold); }

  footer { font-size: .72rem; color: var(--sub); text-align: center; line-height: 1.6; }
  footer a { color: inherit; }

  /* 一番下の設定(トグルスイッチ) */
  .setting { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .setting .label { flex: 1; font-size: .9rem; }
  .setting .label small { display: block; color: var(--sub); font-size: .75rem; margin-top: 2px; }
  .switch { position: relative; flex: none; width: 48px; height: 28px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 14px; background: rgba(120,130,140,.35); transition: background .2s; pointer-events: none; }
  .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="where">
      <div class="place" id="place">ここの天気</div>
      <div class="meta" id="meta">位置を取得しています…</div>
    </div>
    <button id="reload" type="button">更新</button>
  </header>

  <section class="rainstart">
    <h2>6時間以内の雨</h2>
    <div id="rainstart"><div class="msg">読み込み中…</div></div>
  </section>

  <section>
    <h2>24時間 ― 1時間ごとの雨量と気温</h2>
    <div id="hourly" class="rows"></div>
    <div class="legend">雨量は、その1時間に降る量(mm/h)</div>
  </section>

  <section>
    <h2>2〜3日目 ― 3時間ごとの雨量と気温</h2>
    <div id="threehour" class="rows"></div>
    <div class="legend">雨量は3時間の平均(mm/h)、気温は区間の始まりの時刻の値</div>
  </section>

  <section>
    <h2>4〜7日目 ― 天気と最高/最低気温</h2>
    <div id="daily" class="days"></div>
    <div class="legend">% は降水確率、mm は1日の雨量</div>
  </section>

  <footer>
    予報データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>(CC BY 4.0)<br>
    地名: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a><br>
    予報用の位置は約1kmに丸めて送信しています
  </footer>

  <section style="margin-top:14px">
    <label class="setting">
      <span class="label">地名用の位置も約1kmに丸める
        <small id="roundNote">オフ: 地名には正確な位置を国土地理院へ送信(町名も正確)</small></span>
      <span class="switch"><input type="checkbox" id="round" role="switch"><span class="track"></span></span>
    </label>
  </section>
</main>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
